name: Materialize reconciliation snapshots

on:
  push:
    branches:
      - maintenance/reconcile-rich-baseline-gpt56
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: reconciliation-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main snapshot
        uses: actions/checkout@v4
        with:
          ref: 7dada3a5d0c6c0bf0f40208b30215c495e17ee28
          path: snapshots/main
          fetch-depth: 1

      - name: Check out PR 15 rich baseline
        uses: actions/checkout@v4
        with:
          ref: 296867d82d09d51ef2386de2a62067408b7f949c
          path: snapshots/rich
          fetch-depth: 1

      - name: Check out defect-4 candidate
        uses: actions/checkout@v4
        with:
          ref: 96fc7ec34bd3b685a0edeae7ecd4404abab7e2f1
          path: snapshots/defect4
          fetch-depth: 1

      - name: Record pinned revisions and live repository inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshots/metadata
          {
            echo "main=7dada3a5d0c6c0bf0f40208b30215c495e17ee28"
            echo "rich=296867d82d09d51ef2386de2a62067408b7f949c"
            echo "defect4=96fc7ec34bd3b685a0edeae7ecd4404abab7e2f1"
            echo "snapshot_workflow_commit=${GITHUB_SHA}"
          } > snapshots/PINNED_REFS.txt

          gh api "repos/${GITHUB_REPOSITORY}" > snapshots/metadata/repository.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > snapshots/metadata/branches-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" > snapshots/metadata/issues-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" > snapshots/metadata/pulls-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" > snapshots/metadata/workflows-pages.json

          find snapshots -name .git -type d -prune -exec rm -rf {} +

      - name: Upload source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-source-snapshots
          path: snapshots
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
