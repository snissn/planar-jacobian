name: Defect Five Staging Generator

on:
  push:
    branches:
      - issue-29/defect-five-sync-staging-r2

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-29/defect-five-sync-staging-r2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate synchronized tree
        run: |
          set -euo pipefail
          python .github/defect-five-staging/sync.py
          python scripts/render_views.py --write
          git diff --check
      - name: Commit staging output
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md research scripts/render_views.py scripts/validate_repository_legacy.py
          git diff --cached --quiet && exit 1
          git commit -m 'staging(issue-29): generate defect-five shared synchronization'
          git push origin HEAD:issue-29/defect-five-sync-staging-r2
