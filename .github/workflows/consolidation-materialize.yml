name: Consolidation Materializer

on:
  push:
    branches:
      - maintenance/mainline-consolidation-gpt56

permissions:
  contents: write
  statuses: write

concurrency:
  group: consolidation-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor == 'snissn'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA} \
            -f state=pending \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Canonical tree materialization in progress" \
            -f context="consolidation-materializer/run-${GITHUB_RUN_ID}"

      - name: Check out payload revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Materialize canonical files and publish temporary commit
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          cat .maintenance/consolidation-payload.*.b64 | base64 --decode > /tmp/consolidation-remaining.tar.xz
          echo "05a3adc95e589a5d3ef950cc8047f59ae85102ab478d63db67c58435b616e8a7  /tmp/consolidation-remaining.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/consolidation-remaining.tar.xz
          rm -rf .maintenance
          rm -f .github/workflows/consolidation-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "maintenance: materialize reconciled ledgers and validators"
          git push origin HEAD:maintenance/mainline-consolidation-gpt56
          NEW_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$NEW_SHA" | tee exact-sha.txt
          printf '%s\n' "$TREE_SHA" | tee tree-sha.txt
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate materialized exact tree
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts research/issues/issue-3-unramified-index
          python scripts/render_views.py --check | tee generated-views.log
          python scripts/validate_repository.py | tee repository-validation.log
          python scripts/frontier.py | tee frontier.log
          python scripts/validate_defect4_staircase.py | tee defect4-candidate.log
          python scripts/review_validate_defect4_independent.py | tee defect4-independent.log
          python research/issues/issue-3-unramified-index/verify_index_models.py | tee issue3-models.log
          python scripts/validate_issue4_stable_order.py | tee issue4-stable-order.log
          python scripts/validate_issue5_principal_parts.py | tee issue5-principal-parts.log

      - name: Publish materialized tree and result
        if: always() && steps.materialize.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.materialize.outputs.sha }}
          TREE_SHA: ${{ steps.materialize.outputs.tree }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        shell: bash
        run: |
          if [ "$VALIDATION_OUTCOME" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA} \
            -f state="$STATE" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Materialized canonical tree validation: ${VALIDATION_OUTCOME}" \
            -f context="materialized-tree/${TREE_SHA}"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA} \
            -f state="$STATE" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Canonical tree materialization: ${VALIDATION_OUTCOME}" \
            -f context="consolidation-materializer/run-${GITHUB_RUN_ID}"

      - name: Upload materialization and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-materialization-${{ steps.materialize.outputs.sha || github.sha }}-${{ github.run_id }}
          path: |
            exact-sha.txt
            tree-sha.txt
            generated-views.log
            repository-validation.log
            frontier.log
            defect4-candidate.log
            defect4-independent.log
            issue3-models.log
            issue4-stable-order.log
            issue5-principal-parts.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if exact-tree validation failed
        if: steps.validate.outcome != 'success'
        run: exit 1
