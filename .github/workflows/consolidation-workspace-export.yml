name: Consolidation Workspace Export

on:
  push:
    branches:
      - maintenance/mainline-consolidation-gpt56

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package candidate tree
        run: tar --exclude=.git -czf /tmp/consolidation-workspace.tar.gz .
      - name: Upload candidate tree
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-workspace-${{ github.sha }}
          path: /tmp/consolidation-workspace.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA} \
            -f state=success \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Consolidation workspace artifact ready" \
            -f context="consolidation-export/run-${GITHUB_RUN_ID}"
