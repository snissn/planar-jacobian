name: Temporary Defect Five Syntax Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-29/defect-five-clean-integration
          fetch-depth: 0
      - name: Correct the validator comprehension and restore permanent CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('research/issues/defect-5-rees/validate_defect5.py')
          text = path.read_text(encoding='utf-8')
          old = 'ideal = [sp.expand(eq) for equations] + [sp.expand(z * nonzero - 1)]'
          new = 'ideal = [sp.expand(eq) for eq in equations] + [sp.expand(z * nonzero - 1)]'
          if text.count(old) != 1:
              raise SystemExit('expected one malformed comprehension')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/repository-python-validators.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(issue-29): correct defect-five validator comprehension"
          git push origin HEAD:issue-29/defect-five-clean-integration
