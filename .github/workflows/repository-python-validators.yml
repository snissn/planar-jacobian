name: Temporary Defect Five Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-29/defect-five-clean-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic shared synchronization
        run: python research/issues/defect-5-rees/prepare_integration.py
      - name: Commit only the durable clean integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/repository-python-validators.yml
          rm research/issues/defect-5-rees/prepare_integration.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "sync(issue-29): allocate defect-five claim and review successor"
          git push origin HEAD:issue-29/defect-five-clean-integration
