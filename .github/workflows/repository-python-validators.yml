name: Defect Five Final-Tree Generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate synchronized final files
        id: generate
        shell: bash
        run: |
          set +e
          {
            set -x
            python .github/defect-five-staging/sync.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              python scripts/render_views.py --write
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              git diff --check
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              test ! -e research/issues/defect-5-rees/.integration-ready
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              test ! -e research/issues/defect-5-rees/.local-review-complete
              rc=$?
            fi
            echo "return_code=$rc"
          } > defect-five-generation.log 2>&1
          cat defect-five-generation.log
          exit "${rc:-1}"
      - name: Upload generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defect-five-generation-diagnostics-${{ github.run_id }}
          path: defect-five-generation.log
          if-no-files-found: warn
          retention-days: 3
      - name: Upload clean final-tree files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: defect-five-final-tree-${{ github.run_id }}
          path: |
            STATUS.md
            research/CLAIM_LEDGER.md
            research/PROOF_GRAPH.md
            research/WORK_QUEUE.md
            research/ISSUE_INDEX.md
            research/LEGACY_CLAIM_MIGRATION.md
            research/claim_ledger.json
            research/proof_graph.json
            research/work_queue.json
            research/leaf-packets/L15-defect-5-staircase.md
            research/tracks/m-filtered-equivariance.md
            research/issues/defect-5-rees/README.md
            research/issues/defect-5-rees/FOUNDATIONS.md
            research/issues/defect-5-rees/TRANSFORMATIONS.md
            research/issues/defect-5-rees/DERIVATION.md
            research/issues/defect-5-rees/CASE_TABLE.md
            research/issues/defect-5-rees/COUNTERMODEL_SEARCH.md
            research/issues/defect-5-rees/VALIDATION.md
            research/issues/defect-5-rees/VALIDATION.json
            research/issues/defect-5-rees/validate_defect5.py
            research/issues/defect-5-rees/review_validate_defect5_adversarial.py
            research/issues/defect-5-rees/REVIEW.md
            research/issues/defect-5-rees/HANDOFF.md
            research/issues/defect-5-rees/INTEGRATION.json
            scripts/render_views.py
            scripts/validate_repository_legacy.py
          if-no-files-found: error
          retention-days: 3
