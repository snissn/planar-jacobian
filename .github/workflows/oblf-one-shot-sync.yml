name: OBLF one-shot synchronization

on:
  push:
    branches:
      - issue-5/one-boundary-logarithmic-gpt56
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: oblf-one-shot-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: issue-5/one-boundary-logarithmic-gpt56
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Run final shared synchronization
        run: |
          set -euo pipefail
          python -m py_compile research/issues/one-boundary-logarithmic-field/sync_oblf.py
          python research/issues/one-boundary-logarithmic-field/sync_oblf.py

      - name: Validate synchronized tree
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/one-boundary-logarithmic-field
            python research/issues/one-boundary-logarithmic-field/verify_all.py
            python scripts/render_views.py --check
            python scripts/validate_repository.py
            python scripts/frontier.py
            git diff --check
          } 2>&1 | tee /tmp/oblf-validation.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Commit synchronized surfaces
        id: transport
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git status --short
            git add .
            if git diff --cached --quiet; then
              echo 'No synchronization delta to commit.'
            else
              git commit -m 'sync(issue-5): allocate one-boundary claims and frontier'
              git push --verbose origin HEAD:issue-5/one-boundary-logarithmic-gpt56
            fi
          } 2>&1 | tee /tmp/oblf-transport.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish failure diagnostics
        if: steps.validation.outcome == 'failure' || steps.transport.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### OBLF one-shot synchronization diagnostics'
            echo
            echo '**Validation**'
            echo '```text'
            tail -n 200 /tmp/oblf-validation.log 2>/dev/null || true
            echo '```'
            echo
            echo '**Transport**'
            echo '```text'
            tail -n 200 /tmp/oblf-transport.log 2>/dev/null || true
            echo '```'
          } > /tmp/oblf-comment.md
          gh pr comment 34 --body-file /tmp/oblf-comment.md
          exit 1
