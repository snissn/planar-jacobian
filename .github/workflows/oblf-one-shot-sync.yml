name: OBLF one-shot synchronization

on:
  push:
    branches:
      - issue-5/one-boundary-logarithmic-gpt56
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oblf-one-shot-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: issue-5/one-boundary-logarithmic-gpt56
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Rebind synchronization metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/issues/one-boundary-logarithmic-field/sync_oblf.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'candidate_revision: ad7abee8370146e40f41cb2d108cf07dc129df03',
              'candidate_revision: 02547f9a1c8c72486ad2bb07a06a10fde1351af4',
          )
          text = text.replace(
              'review_revision: 1e585ee1b8fc4ae9a91500f7b1ae9607845fa630',
              'review_revision: 3a96a48280228a7e38a4ca488109f90147d59b1c',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run final shared synchronization
        run: |
          set -euo pipefail
          python -m py_compile research/issues/one-boundary-logarithmic-field/sync_oblf.py
          python research/issues/one-boundary-logarithmic-field/sync_oblf.py

      - name: Byte-compile synchronized tree
        run: python -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/one-boundary-logarithmic-field

      - name: Check issue-owned packet structure
        run: python research/issues/one-boundary-logarithmic-field/verify_all.py --structure-only

      - name: Run exact OBLF symbolic identities
        run: python research/issues/one-boundary-logarithmic-field/verify_all.py --symbolic-only

      - name: Run aggregate issue-owned checker
        run: python research/issues/one-boundary-logarithmic-field/verify_all.py

      - name: Verify generated views
        run: python scripts/render_views.py --check

      - name: Validate repository structure
        run: python scripts/validate_repository.py

      - name: Render frontier
        run: python scripts/frontier.py

      - name: Check synchronized patch
        run: git diff --check

      - name: Publish synchronized files through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: issue-5/one-boundary-logarithmic-gpt56
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          printf 'Publishing %s synchronized paths.\n' "${#files[@]}"
          for path in "${files[@]}"; do
            # The permanent validator workflow is updated by the connected
            # GitHub adapter after this generated-tree transport completes.
            if [[ "$path" == ".github/workflows/repository-python-validators.yml" ]]; then
              echo "defer adapter-owned workflow update: $path"
              continue
            fi
            encoded=$(base64 -w0 "$path")
            current_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$TARGET_BRANCH" \
              --jq .sha 2>/dev/null || true)
            args=(
              --method PUT
              "repos/$GITHUB_REPOSITORY/contents/$path"
              -f "message=sync(issue-5): update $path"
              -f "content=$encoded"
              -f "branch=$TARGET_BRANCH"
            )
            if [[ -n "$current_sha" ]]; then
              args+=( -f "sha=$current_sha" )
            fi
            gh api "${args[@]}" --jq '.commit.sha'
          done
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/research/claim_ledger.json?ref=$TARGET_BRANCH" \
            --jq .content | tr -d '\n' | base64 -d | grep -q '"id": "CLM-072"'
          echo 'Remote OBLF synchronization marker: PASS'
