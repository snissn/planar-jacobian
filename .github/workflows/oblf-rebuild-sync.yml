name: OBLF latest-main rebuild synchronization

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oblf-latest-main-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest-main integration branch
        uses: actions/checkout@v4
        with:
          ref: issue-5/one-boundary-logarithmic-gpt56-r2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Transplant only the issue-owned packet
        run: |
          set -euo pipefail
          git fetch origin issue-5/one-boundary-logarithmic-gpt56
          git checkout origin/issue-5/one-boundary-logarithmic-gpt56 -- \
            research/issues/one-boundary-logarithmic-field
          test ! -e research/issues/one-boundary-logarithmic-field/VALIDATION_DIAGNOSTICS.txt

      - name: Rebind synchronization to current main
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/issues/one-boundary-logarithmic-field/sync_oblf.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'main@788e94419080debf356d17123cbf81cb23b391ac':
                  'main@114aefeaf98429a3bd08ca9429b4ceebd3d21e08',
              'source_main: 788e94419080debf356d17123cbf81cb23b391ac':
                  'source_main: 114aefeaf98429a3bd08ca9429b4ceebd3d21e08',
              'candidate_revision: ad7abee8370146e40f41cb2d108cf07dc129df03':
                  'candidate_revision: 02547f9a1c8c72486ad2bb07a06a10fde1351af4',
              'review_revision: 1e585ee1b8fc4ae9a91500f7b1ae9607845fa630':
                  'review_revision: 3a96a48280228a7e38a4ca488109f90147d59b1c',
              '"python3 -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit",':
                  '"python3 -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/source-reflexive-lattice",',
              '"python3 -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/one-boundary-logarithmic-field",':
                  '"python3 -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/source-reflexive-lattice research/issues/one-boundary-logarithmic-field",',
              '"run: python -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit",':
                  '"run: python -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/source-reflexive-lattice",',
              '"run: python -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/one-boundary-logarithmic-field",':
                  '"run: python -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/source-reflexive-lattice research/issues/one-boundary-logarithmic-field",',
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)
          missing = [new for new in replacements.values() if new not in text]
          if missing:
              raise SystemExit('missing rebound targets: ' + repr(missing))
          path.write_text(text, encoding='utf-8')
          PY

      - name: Generate latest-main synchronization
        run: |
          set -euo pipefail
          python -m py_compile research/issues/one-boundary-logarithmic-field/sync_oblf.py
          python research/issues/one-boundary-logarithmic-field/sync_oblf.py

      - name: Validate rebuilt tree
        run: |
          set -euo pipefail
          python -m compileall -q scripts research/issues/issue-3-unramified-index research/issues/rank-three-index-form-unit research/issues/source-reflexive-lattice research/issues/one-boundary-logarithmic-field
          python research/issues/one-boundary-logarithmic-field/verify_all.py
          python scripts/render_views.py --check
          python scripts/validate_repository.py
          python scripts/frontier.py
          git diff --check

      - name: Publish rebuilt files through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: issue-5/one-boundary-logarithmic-gpt56-r2
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          printf 'Publishing %s rebuilt paths.\n' "${#files[@]}"
          for path in "${files[@]}"; do
            if [[ "$path" == ".github/workflows/repository-python-validators.yml" ]]; then
              echo "defer adapter-owned workflow update: $path"
              continue
            fi
            encoded=$(base64 -w0 "$path")
            current_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$TARGET_BRANCH" \
              --jq .sha 2>/dev/null || true)
            args=(
              --method PUT
              "repos/$GITHUB_REPOSITORY/contents/$path"
              -f "message=sync(issue-5): rebuild $path on latest main"
              -f "content=$encoded"
              -f "branch=$TARGET_BRANCH"
            )
            if [[ -n "$current_sha" ]]; then
              args+=( -f "sha=$current_sha" )
            fi
            gh api "${args[@]}" --jq '.commit.sha'
          done
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/research/claim_ledger.json?ref=$TARGET_BRANCH" \
            --jq .content | tr -d '\n' | base64 -d | grep -q '"id": "CLM-072"'
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/research/issues/one-boundary-logarithmic-field/SYNC_REPORT.md?ref=$TARGET_BRANCH" \
            --jq .content | tr -d '\n' | base64 -d | grep -q 'source_main: 114aefeaf98429a3bd08ca9429b4ceebd3d21e08'
          echo 'Remote latest-main OBLF synchronization: PASS'
