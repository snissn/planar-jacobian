name: Temporary Rank-Three Shared Synchronization

on:
  push:
    branches:
      - issue-3/rank-three-sync-temp-gpt56

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Generate, validate, and commit isolated shared synchronization
        run: python research/issues/rank-three-index-form-unit/sync_shared_temp.py
