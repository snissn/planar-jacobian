name: Temporary Rank-Three Shared Synchronization

on:
  push:
    branches:
      - issue-3/rank-three-sync-temp-gpt56
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Generate, validate, and commit isolated shared synchronization
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[skip sync]'; then
            echo "skip marker present"
            exit 0
          fi
          set +e
          python research/issues/rank-three-index-form-unit/sync_shared_temp.py 2>&1 | tee /tmp/rank-three-sync.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && git log -1 --pretty=%s | grep -Fq 'sync(issue-3): allocate rank-three claims and frontier'; then
            echo "recovering validated local commit from workflow-write rejection" | tee -a /tmp/rank-three-sync.log
            git checkout HEAD^ -- .github/workflows/repository-python-validators.yml
            git add .github/workflows/repository-python-validators.yml
            git commit --amend --no-edit
            git push origin HEAD
            exit 0
          fi
          exit "$status"
      - name: Upload synchronization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank-three-sync-log-${{ github.run_id }}
          path: /tmp/rank-three-sync.log
          if-no-files-found: warn
          retention-days: 1
